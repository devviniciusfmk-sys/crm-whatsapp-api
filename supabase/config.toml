# As duas nasceram em 2026/08/10 e ficaram FORA daqui, o que só apareceu no dia
# em que o mapa de importação passou a importar: elas subiam por acaso, com o
# CLI adivinhando, e pararam de subir quando as dependências deixaram o CDN.
# Função que não está declarada é função que funciona até não funcionar.
[functions.avisar]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/avisar/index.ts"

[functions.encaixe]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/encaixe/index.ts"

# O gateway é externo e não tem JWT do Supabase para mandar. Quem autentica o
# postback é o adaptador, com o segredo combinado — ver `pagamentos/provedores`.
[functions.pagamentos]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/pagamentos/index.ts"

[functions.leads-sync]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/leads-sync/index.ts"

# admin e loja nunca tiveram entrada aqui — sem `verify_jwt = false`, o
# gateway do Supabase exige um JWT válido em TODA requisição, inclusive o
# preflight CORS (OPTIONS) que o navegador manda sozinho, sem Authorization.
# Isso barra a chamada antes dela chegar no Hono (que já faz sua própria
# checagem de JWT/admin por dentro) — só no navegador, nunca via curl direto,
# o que fez o bug parecer "trava só às vezes" por semanas. - 2026/08/28
[functions.admin]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/admin/index.ts"

[functions.loja]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/loja/index.ts"
